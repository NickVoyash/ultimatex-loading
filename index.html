<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UltimateX — Loading</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090609;color:white;font-family:Arial,sans-serif;overflow:hidden}.scene{position:absolute;inset:0;background:url('banner.png') center center/contain no-repeat;background-color:#070508}.panel{position:absolute;left:28%;right:28%;top:70%;min-height:13%;padding:1.3vw 1.8vw;background:rgba(10,5,8,.96);border:2px solid #ff3434;box-shadow:0 0 22px #f11, inset 0 0 16px #5d0505;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:10px}.title{font-weight:800;font-size:clamp(16px,2vw,34px);text-shadow:0 0 12px #f33}.bar{height:12px;border:1px solid #ff6666;border-radius:20px;overflow:hidden;background:#1b1115}.bar:before{content:'';display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,#ff2424,white,#ff2424,transparent);animation:scan 2s ease-in-out infinite}.status{font-size:clamp(11px,1vw,18px);color:#ddd;overflow-wrap:anywhere}@keyframes scan{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}@media(max-width:700px){.panel{left:15%;right:15%;top:69%}}</style></head><body><div class="scene"></div><div class="panel"><div class="title" id="title">Подключение к серверу…</div><div class="bar"></div><div class="status" id="status">Ожидание информации от Garry’s Mod</div></div><script>function SetStatusChanged(s){document.getElementById('status').textContent=String(s);document.getElementById('title').textContent='Загрузка игровых файлов…'}function SetFilesNeeded(n){document.getElementById('status').textContent='Файлов к загрузке: '+n}function SetFilesTotal(n){document.getElementById('status').textContent='Всего файлов: '+n}function DownloadingFile(name){document.getElementById('title').textContent='Загрузка игровых файлов…';document.getElementById('status').textContent='Файл: '+name}function GameDetails(serverurl,servername,mapname,maxplayers,steamid,gamemode){document.getElementById('status').textContent='Сервер: '+(servername||'UltimateX')+' • Карта: '+(mapname||'…')} </script></body></html>
